# Standalone dedicated host only; do not use on existing public Traefik ports.
services:
  caddy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    ports: ["80:80", "443:443"]
    volumes:
      - generated:/etc/civcom:ro
      - caddy-data:/data
      - caddy-config:/config
    command: [caddy, run, --config, /etc/civcom/Caddyfile, --adapter, caddyfile]
    depends_on:
      prepare:
        condition: service_completed_successfully
      guard:
        condition: service_healthy
    networks: [push]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: 1m, max-file: "2"}
volumes:
  caddy-data: {}
  caddy-config: {}
